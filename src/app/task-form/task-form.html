<dialog #dialog (close)="form.reset()" class="m-auto rounded-lg shadow-lg w-full max-w-2xl p-6 backdrop:bg-black/40">
  <div class="flex items-start justify-between mb-4">
    <h3 class="text-lg font-semibold">Nova tarefa</h3>
    <button type="button" (click)="close()" class="text-slate-500 hover:text-slate-800">✕</button>
  </div>

  <form #form method="dialog" (submit)="submit(form)" class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
    <label class="text-sm text-slate-700">Título
      <input name="title" required class="w-full mt-1 p-2 border border-gray-200 rounded" />
    </label>
    <label class="text-sm text-slate-700">Data término
      <input name="due" type="date" required class="w-full mt-1 p-2 border border-gray-200 rounded" />
    </label>
    <label class="text-sm text-slate-700">Nível
      <select name="level" class="w-full mt-1 p-2 border border-gray-200 rounded">
        <option value="low">Baixo</option>
        <option value="medium">Médio</option>
        <option value="high">Alto</option>
      </select>
    </label>
    <label class="md:col-span-3 text-sm text-slate-700">Descrição (breve)
      <textarea name="desc" rows="2" class="w-full mt-1 p-2 border border-gray-200 rounded"></textarea>
    </label>
    <div class="md:col-span-3 text-right">
      <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Salvar tarefa</button>
    </div>
  </form>
</dialog>
