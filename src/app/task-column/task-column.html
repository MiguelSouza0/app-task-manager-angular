<section>
  <h2 class="font-semibold mb-2">{{ title() }}</h2>
  <div cdkDropList [cdkDropListData]="status()" (cdkDropListDropped)="drop($event)" class="space-y-3 min-h-[200px] p-3 bg-white rounded shadow-sm">
    @for (task of tasks(); track task.id) {
      <app-task-card cdkDrag [cdkDragData]="task.id" class="block cursor-move" [task]="task" (removed)="removed.emit($event)" />
    }
  </div>
</section>
